/* Reading appearance */
:root {--reader-size:22px;--reader-line:1.76}
.readingToolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:14px 0 12px}
.modeControl{display:flex;gap:3px;align-items:center;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--line)}
.modeControl button{border:0;background:transparent;color:var(--muted);font-size:12px;min-height:36px;border-radius:9px;padding:7px 9px;font-weight:650}
.modeControl button.active{background:var(--raised);color:var(--text);box-shadow:0 1px 3px #0002}
.fontControl{display:flex;align-items:center;gap:5px}
.fontControl button,.themeSwitch{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;min-width:37px;min-height:37px;padding:7px 9px;font-size:15px;font-weight:700}
.themeSwitch{font-size:19px;min-width:41px;min-height:41px}
.versebody{font-size:var(--reader-size);line-height:var(--reader-line)}
.verserow.activeAudio{background:rgba(54,183,208,.18);border-radius:10px;padding:14px 10px;outline:1px solid rgba(54,183,208,.42);scroll-margin-block:30vh}
.verserow.activeAudio .versernum{color:var(--accent)}
.versebody.emptyScript{color:var(--muted);font-style:italic}
.nowScripture{background:var(--raised);border-radius:14px;padding:16px;margin:14px 0 18px;max-height:30vh;overflow:auto;font-size:var(--reader-size);line-height:var(--reader-line);text-align:left}
.nowScripture .line{display:block;padding:3px 0;border-radius:8px}
.nowScripture .line.playingVerse{background:rgba(54,183,208,.2);color:var(--text);outline:1px solid rgba(54,183,208,.35)}
.nowScripture .verseNum{font-size:12px;color:var(--accent);font-weight:800;margin-right:8px}
.nowScripture.muteText{text-align:center;font-size:14px;color:var(--muted)}
.playerSettings{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:13px 0}
.speedChip{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:720}
/* Light theme overrides; no additional library or network calls. */
html[data-theme=light]{color-scheme:light;--bg:#fbfaf7;--surface:#f1f5f3;--raised:#fff;--line:#d9e1de;--text:#182a32;--muted:#566872;--brand-teal:#088ba9;--accent:#086d84;--a2:#088ba9;--shadow:0 16px 50px #152b331b}
html[data-theme=light] body{background:var(--bg);color:var(--text)}
html[data-theme=light] .brand span{color:#52666f!important}
html[data-theme=light] .hero{background:linear-gradient(135deg,#dbefe8,#d9e4e9 90%)}
html[data-theme=light] .hero .eyebrow{color:#365c62}
html[data-theme=light] .hero p{color:#536671}
html[data-theme=light] .btn{background:#edf3f1;color:var(--text);border-color:var(--line)}
html[data-theme=light] .btn.primary, html[data-theme=light] .floatplay{background:#088ba9;color:white;border-color:#088ba9}
html[data-theme=light] .selectRow select,html[data-theme=light] .voicePicker select,html[data-theme=light] .formField input,html[data-theme=light] .formField select{background:white;color:var(--text);border-color:#bacdc9}
html[data-theme=light] .voicePreview,html[data-theme=light] .pill{background:#f0f5f2;color:var(--text);border-color:#c8d4d0}
html[data-theme=light] .pill.on{background:#088ba9;color:white}
html[data-theme=light] .verserow{border-bottom-color:#e4ebe7}
html[data-theme=light] .versebody{color:var(--text)}
html[data-theme=light] .verserow.activeAudio{background:#d7eff6;outline-color:#8dccdd}
html[data-theme=light] .verserow.activeAudio .versernum{color:#086d84}
html[data-theme=light] .playlistcard{background:#f4f7f5;border-color:#d7e3df;color:var(--text)}
html[data-theme=light] .track{border-bottom-color:#e0e7e3}
html[data-theme=light] .trackmain{color:var(--text)}
html[data-theme=light] .add{background:#edf7f3;border-color:#a8cfc2}
html[data-theme=light] .floating{background:#f8fcf9;border-color:#cbdad5}
html[data-theme=light] .floatOpen{color:var(--text)}
html[data-theme=light] .floatOpen small{color:#607179}
html[data-theme=light] .tabs{background:#f5f8f6;border-top-color:#d0ded9}
html[data-theme=light] .tab{color:#617b82}
html[data-theme=light] .tab.on{color:#086d84}
html[data-theme=light] .sheet{background:#f8fbf9;border-color:#d0ded9}
html[data-theme=light] .x{background:#e5efeb;color:var(--text)}
html[data-theme=light] .number,html[data-theme=light] .nowSource{color:#61767a}
html[data-theme=light] .nowScripture .line.playingVerse{background:#d7eff6}
html[data-theme=light] .modeControl button.active{background:#fff}
.noTextState{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--muted);text-align:center;padding:24px 12px}
.noTextState .noTextIcon{font-size:29px;color:var(--accent)}
.noTextState p{margin:0;font-size:14px;line-height:1.5}
#readerContent .verserow.activeAudio{transition:background-color .18s,outline-color .18s}
@media(prefers-reduced-motion:reduce){#readerContent .verserow.activeAudio{transition:none}}

/* Compact, accessible player. Controls stay visible; only Scripture scrolls. */
.playerSummary{display:flex;align-items:center;gap:12px;min-width:0;margin:0 0 2px}
.playerSummary .playerface{flex:0 0 65px;width:65px;height:65px;border-radius:12px;margin:0;gap:0;box-shadow:none}
.playerSummary .playerface big{font-size:19px;line-height:1.15}
.playerSummary .playerface span{font-size:5px;letter-spacing:.08em}
.playerSummary .cent{min-width:0;text-align:left;flex:1}
.playerSummary .nowTitle{font-size:clamp(18px,5vw,23px);line-height:1.17;margin:0 0 3px}
.playerSummary .nowSource{font-size:12px;line-height:1.3}
.playerSummary #nowPhase{margin:5px 0 0;font-size:12px!important}
#playerArea{display:flex;flex-direction:column;flex:1;min-height:0}
#playerArea .progress{flex-shrink:0;margin:9px 0 5px}
#playerArea .timebar{flex-shrink:0}
#nowReadingArea{display:flex;flex-direction:column;min-height:0;flex:1}
#nowReadingArea .readingToolbar{flex-shrink:0;margin:8px 0 5px}
#nowReadingArea .nowScripture{flex:1;min-height:0;max-height:none;margin:5px 0 6px;padding:13px 13px 16px;scroll-padding-top:12px;overscroll-behavior:contain}
#playerDock{flex-shrink:0;border-top:1px solid var(--line);padding-top:5px}
#playerDock .transport{margin:2px 0 3px;gap:clamp(12px,8vw,44px)}
#playerDock .transport .mainTransport{height:54px;width:54px;font-size:23px}
#playerDock .playerSettings{margin:3px 0}
#playerDock .quickopts{margin:6px 0 2px;gap:6px;flex-wrap:nowrap}
#playerDock .quickopts .pill{padding:8px 10px;flex:1;min-width:0;white-space:nowrap;font-size:11px}
#playerArea #nowError{flex-shrink:0;max-height:72px;overflow:auto;margin:4px 0}
.verserow.activeAudio{scroll-margin-top:10px;scroll-margin-bottom:10px}
.backupRow{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0 4px}
.backupRow .mutebtn{min-height:42px}
.backupHint{font-size:12px;line-height:1.5;text-align:center;margin:0 0 20px}
.backupStatus{font-size:13px;line-height:1.55;text-align:center;color:var(--muted);margin:12px 0 3px}
.backupStatus.needed{color:var(--accent);font-weight:650}
html[data-theme=light] #playerDock{border-color:var(--line)}
@media(max-width:699px){
 .sheet:has(#playerArea){display:flex;flex-direction:column;height:100dvh;max-height:100dvh;overflow:hidden;padding:12px 16px calc(9px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
 .sheet:has(#playerArea) .sheethead{flex-shrink:0;margin-bottom:10px}
 .sheet:has(#playerArea) .sheethead h2{font-size:20px}
 .sheet:has(#playerArea) .sheethead .x{height:36px;width:36px}
}
@media(min-width:700px){
 .sheet:has(#playerArea){display:flex;flex-direction:column;min-height: min(680px,85dvh);height:85dvh;overflow:hidden}
}
.ui-icon{display:inline-block;vertical-align:-.17em;flex-shrink:0}
.btn,.mutebtn,.pill,.sample,.add,.speedChip{align-items:center}
.btn .ui-icon,.mutebtn .ui-icon,.pill .ui-icon,.sample .ui-icon,.add .ui-icon{margin-right:5px}
.tab .ui-icon{display:block;margin:0 auto 3px;color:currentColor}
.playerface .ui-icon{color:var(--accent)}
.themeSwitch .ui-icon{vertical-align:middle;color:var(--accent)}
.transport button .ui-icon{vertical-align:middle}
.quickopts .pill .ui-icon{color:var(--accent)}
#floatPlay .ui-icon{vertical-align:middle}

.featuredHeading{margin:20px 0 10px}
.featuredEntry{display:flex;align-items:stretch;gap:8px;margin:0 0 9px}
.featuredEntry .featuredCard{flex:1;min-width:0;margin:0}
.featuredAdd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:60px;padding:10px 8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--accent);font-size:12px;font-weight:750}
.featuredAdd:hover,.featuredAdd:focus-visible{border-color:var(--accent)}

.featuredCard{width:100%;text-align:left;display:flex;align-items:center;gap:13px;border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:14px 13px;margin:0 0 8px;color:var(--text);min-height:72px}
.featuredCard .featuredIcon{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;background:var(--raised);border-radius:12px;color:var(--accent)}
.featuredCard strong{display:block;font-size:15px;margin-bottom:3px}
.featuredCard small{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.featuredCard .featureNext{margin-left:auto;color:var(--muted)}
.featuredList{overflow:auto;max-height:36dvh;border:1px solid var(--line);border-radius:12px;background:var(--raised);padding:5px 12px;margin:14px 0}
.featuredVerse{padding:10px 3px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center;font-size:14px}
.featuredVerse:last-child{border:0}
.featuredVerse .featuredNumber{min-width:26px;color:var(--muted);font-size:12px}
.featuredSource{font-size:12px;color:var(--muted);margin-top:12px}
.featuredSource a{color:var(--accent)}

/* Collapsible lists. The user's own playlists are the primary surface on both sites. */
.playlistSection{margin:19px 0 16px}
.sectionToggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;min-height:50px;border-radius:13px;background:var(--surface);border:1px solid var(--line);color:var(--text);text-align:left;font:inherit;cursor:pointer}
.sectionToggle .sectionTitle{font-size:19px;font-weight:750;letter-spacing:-.02em}
.sectionToggle .sectionRight{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.sectionToggle .sectionChevron{display:inline-flex;transition:transform .2s ease}
.sectionToggle[aria-expanded="true"] .sectionChevron{transform:rotate(180deg)}
.sectionContent{padding:14px 2px 1px}
.sectionContent[hidden]{display:none!important}
.sectionInfo{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 14px}
.sectionContent .backupRow{margin-top:22px}
.sectionContent .backupHint{margin-bottom:0}
.personalPresetCard{border-color:var(--accent);background:var(--surface)}
.personalPresetCard .presetLabel{color:var(--accent);font-size:12px;font-weight:650}
@media(prefers-reduced-motion:reduce){.sectionChevron{transition:none}}


/* Compact, source-only Philippians study view */
.studyRoot{margin:3px 0 13px}
.studyRoot>summary{display:flex;align-items:center;gap:8px;min-height:44px;list-style:none;cursor:pointer;color:var(--muted);font-size:13px;padding:5px 3px}

function philRich(nodes,depth=0){

  if(typeof n==='string')return enc(n);
  if(!n||typeof n!=='object'||Array.isArray(n))throw Error('Invalid resource node');
  if(n.t==='x2002')return '&#8194;';
  if(['p','h','omit','span'].includes(n.t)){
   const tag=n.t==='h'?'h4':n.t==='p'?'p':'span';
   return '<'+tag+'>'+philRich(n.c,depth+1)+'</'+tag+'>';
  }
  if(['em','ref','link'].includes(n.t)&&typeof n.v==='string')return n.t==='em'?'<em>'+enc(n.v)+'</em>':enc(n.v);
  throw Error('Unsupported resource node');

 });

const TSK_BOOK_CODES={"gen":"GEN","exod":"EXO","lev":"LEV","num":"NUM","deut":"DEU","josh":"JOS","judg":"JDG","ruth":"RUT","1 sam":"1SA","2 sam":"2SA","1 kgs":"1KI","2 kgs":"2KI","1 chr":"1CH","2 chr":"2CH","ezra":"EZR","neh":"NEH","esth":"EST","job":"JOB","ps":"PSA","prov":"PRO","eccl":"ECC","song":"SNG","isa":"ISA","jer":"JER","lam":"LAM","ezek":"EZK","dan":"DAN","hos":"HOS","joel":"JOL","amos":"AMO","obad":"OBA","jonah":"JON","mic":"MIC","nah":"NAM","hab":"HAB","zeph":"ZEP","hag":"HAG","zech":"ZEC","mal":"MAL","matt":"MAT","mark":"MRK","luke":"LUK","john":"JHN","acts":"ACT","rom":"ROM","1 cor":"1CO","2 cor":"2CO","gal":"GAL","eph":"EPH","phil":"PHP","col":"COL","1 thess":"1TH","2 thess":"2TH","1 tim":"1TI","2 tim":"2TI","titus":"TTS","phlm":"PHM","heb":"HEB","jas":"JAS","1 pet":"1PE","2 pet":"2PE","1 john":"1JN","2 john":"2JN","3 john":"3JN","jude":"JUD","rev":"REV"};
function philParseReference(reference){
 const m=/^(.+?) (\d+):(\d+(?:-\d+)?(?:,\d+(?:-\d+)?)*)$/.exec(reference);
 if(!m)throw Error('Unsupported reference');
 const key=TSK_BOOK_CODES[m[1].toLowerCase()],chapter=Number(m[2]);
 if(!key||chapter<1||chapter>bchap(key))throw Error('Unsupported book/chapter');
 const numbers=[];
 for(const group of m[3].split(',')){
  const pair=group.split('-').map(Number),start=pair[0],end=pair[1]||start;
  if(start<1||end<start||end>176)throw Error('Unsupported verse range');
  for(let v=start;v<=end;v++)if(!numbers.includes(v))numbers.push(v);
 }
 return {key,chapter,numbers};
}
let philCrossToken=0;
async function philCross(reference,passages){

 const active=()=>token===philCrossToken&&$('philStudy')===root&&state.book===originBook&&state.chapter===originChapter;
 try{
  if(!Array.isArray(passages)||!passages.length)throw Error('Missing verified reference');
  const blocks=[];
  for(const p of passages){
   const source=await chapterData(p.book,p.chapter);if(!active())return;
   const sourceVerses=(source.chapter?.content||[]).filter(v=>v.type==='verse');
   const verses=p.verses.map(n=>sourceVerses.find(v=>Number(v.number)===n));
   if(verses.some(v=>!v))throw Error('Incomplete passage');
   blocks.push((passages.length>1?'<h3>'+enc(bname(p.book)+' '+p.chapter)+'</h3>':'')+verses.map(v=>'<p><strong>'+Number(v.number)+'</strong> '+enc(txtOf(v))+'</p>').join(''));

  $('philBack').onclick=closeModal;philWireTextControls($('sheet'));
 }catch(e){if(!active())return;openModal(reference,'<p>This passage could not load completely. Check your connection and try again.</p>');}
}

function sortableRows(holder,onMove,holderId){
 const rows=()=>[...holder.children].filter(r=>r.classList.contains('dragRow'));
 rows().forEach((row,index)=>{
  const handle=row.querySelector('.dragHandle');if(!handle)return;
  handle.addEventListener('keydown',e=>{if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;e.preventDefault();const to=index+(e.key==='ArrowUp'?-1:1);if(to<0||to>=rows().length)return;onMove(index,to);requestAnimationFrame(()=>$(holderId)?.querySelectorAll('.dragHandle')[to]?.focus());});
  handle.addEventListener('pointerdown',e=>{
   if(e.button>0)return;e.preventDefault();try{handle.setPointerCapture(e.pointerId)}catch{}
   let frame=null;try{frame=window.frameElement}catch{}
   const frameTop=()=>frame?frame.getBoundingClientRect().top:0,doc=row.ownerDocument.scrollingElement;
   let outer=e.clientY+frameTop(),ty=0,moved=false,raf=0;
   const pointerY=()=>outer-frameTop();let base=pointerY()+scrollY;
   row.classList.add('dragging');
   const step=()=>{
    const y=pointerY()+scrollY;let dy=y-base;
    const prev=row.previousElementSibling,next=row.nextElementSibling;
    const swap=fn=>{const before=row.getBoundingClientRect().top-ty;fn();base+=row.getBoundingClientRect().top-ty-before;dy=y-base;moved=true;};
    if(next?.classList.contains('dragRow')&&dy>next.offsetHeight/2)swap(()=>holder.insertBefore(next,row));
    else if(prev?.classList.contains('dragRow')&&dy<-prev.offsetHeight/2)swap(()=>holder.insertBefore(row,prev));
    ty=dy;row.style.transform='translateY('+dy+'px)';
    // Near the top or bottom edge, scroll whichever page holds the list (this page, or the app around an embedded player).
    const edge=70;let s=0;
    if(!frame||(doc&&doc.scrollHeight>innerHeight+2)){const c=pointerY();if(c<edge)s=-(edge-c)/5;else if(c>innerHeight-edge)s=(c-innerHeight+edge)/5;if(s)scrollBy(0,s);}
    else{const h=parent.innerHeight;if(outer<edge)s=-(edge-outer)/5;else if(outer>h-edge)s=(outer-h+edge)/5;if(s)parent.scrollBy(0,s);}
    raf=requestAnimationFrame(step);
   };
   raf=requestAnimationFrame(step);
   const move=ev=>{outer=ev.clientY+frameTop();};
   const end=()=>{cancelAnimationFrame(raf);handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',end);handle.removeEventListener('pointercancel',end);row.classList.remove('dragging');row.style.transform='';const to=rows().indexOf(row);if(moved&&to!==index)onMove(index,to);};
   handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);
  });
 });

    return {id:uid(),book,chapter,start,end,reps,...(pauseSeconds===undefined?{}:{pauseSeconds})};
   });
   return {id:uid(),name:p.name.trim().slice(0,100)||'Restored Playlist',items};
  });
  state.lists.push(...imported);state.current=imported[0].id;
  state.tab='playlists';render();

 finally{input.value='';}
}

// A best-effort HTMLMediaElement deadline watcher, not a sample-accurate cutter.
// Re-read media time at every callback; wall-clock time never completes a clip.
function createBoundaryScheduler({ media, readBoundary, finish, schedule = setTimeout, unschedule = clearTimeout }) {
  let timer = null;
  let generation = 0;
  function cancel() {
    generation++;
    if (timer !== null) unschedule(timer);
    timer = null;
  }
  function sync() {
    cancel();
    const boundary = readBoundary();
    if (!boundary || !Number.isFinite(boundary.end) || media.paused || media.seeking || media.ended) return;
    const rate = Number(media.playbackRate);
    const position = Number(media.currentTime);
    if (!(rate > 0) || !Number.isFinite(position)) return;
    if (position >= boundary.end) {
      finish(boundary);
      return;
    }
    const ticket = generation;
    // Deadline estimate follows the current rate. The 250ms cap periodically
    // reconciles buffering/drift; 4ms avoids a near-boundary busy loop.
    const delay = Math.max(4, Math.min(250, (boundary.end - position) * 1000 / rate));
    timer = schedule(() => {
      if (ticket !== generation) return;
      timer = null;
      const current = readBoundary();
      if (!current || current.key !== boundary.key || current.end !== boundary.end) return;
      sync();
    }, delay);
  }
  return { sync, cancel };
}

// Scheduler-only preview: keep the existing 100ms finish threshold unchanged.
// Source cues remain untouched. Precise word boundaries still need listening QA.

  media: audio,
  readBoundary: () => {
    const end = player.phase === 'playing' ? player.to : player.phase === 'preview' ? player.previewEnd : null;
    return Number.isFinite(end) ? { key: `${player.token}:${player.phase}`, end: end - .1, token: player.token, phase: player.phase } : null;
  },
  finish: boundary => {
    if (boundary.token !== player.token || boundary.phase !== player.phase) return;
    if (boundary.phase === 'playing') finishStep();
    else finishVoicePreview();
  }
});

function sleepGap(ms){
  boundaryScheduler.cancel();clearTimeout(player.timer);clearInterval(player.clock);
  const token=player.token;
  player.phase='gap';player.gapLeft=ms;player.gapStart=Date.now();audio.pause();
  player.timer=setTimeout(()=>{if(token!==player.token||player.phase!=='gap')return;clearInterval(player.clock);player.gapLeft=0;nextStep()},ms);
  player.clock=setInterval(()=>{if(token===player.token&&player.phase==='gap')updatePlayerUI()},350);
  updatePlayerUI();
}

async function playStep(){
  const s=player.steps[player.index];if(!s)return;
  boundaryScheduler.cancel();clearTimeout(player.timer);clearInterval(player.clock);audio.pause();
  const token=++player.token;player.phase='loading';player.gapLeft=0;player.pausedFrom=null;player.readerChanged=false;player.label=ref(s);updatePlayerUI();
  try{
    const [meta,time]=await Promise.all([chapterData(s.book,s.chapter),timingData(s.book,s.chapter,state.reader)]);
    if(token!==player.token)return;
    const a=Array.isArray(time.verses)?time.verses:[];
    const max=meta.numberOfVerses||a.length;const last=Math.min(s.end,max);
    const start=Number(a[s.start-1]);const end=last>=a.length?null:Number(a[last]);
    if(!Number.isFinite(start)||start<0)throw Error('Verse timestamps are not available for this selection');

    if(!source)throw Error('Audio recording not available for this narrator');

    player.from=Math.max(0,start);player.to=end??audio.duration;

function toggle(){
  if(['playing','loading','preview'].includes(player.phase)){
    player.pausedFrom=player.phase;player.token++;boundaryScheduler.cancel();audio.pause();player.phase='paused';updatePlayerUI();return;

  if(player.phase==='gap'){
    player.pausedFrom='gap';player.gapLeft=Math.max(0,player.gapLeft-(Date.now()-player.gapStart));
    player.token++;boundaryScheduler.cancel();clearTimeout(player.timer);clearInterval(player.clock);player.phase='paused';updatePlayerUI();return;
  }
  if(player.phase==='paused'){
    if(player.readerChanged||player.pausedFrom==='loading'){player.readerChanged=false;return playStep()}
    if(player.pausedFrom==='gap'){sleepGap(player.gapLeft);return}

function embeddedSnapshot(source=state){return {version:1,lists:source.lists,current:source.current??null,options:{repeat:source.options?.repeat,reflect:source.options?.reflect,pause:source.options?.pause,speed:source.options?.speed,chapterMode:source.options?.chapterMode??'stop'},display:{theme:source.display?.theme,font:source.display?.font,mode:source.display?.mode},studyFont:source.studyFont??philTextSize};}

async function embeddedBackupRPC(m){

  stop();state=next;philTextSize=next.studyFont;embeddedSleepEnded=false;embeddedSaveError='';embeddedStorageWarning();closeModal();embeddedRecordPlaylistMutation();const tab=state.tab;state.tab='listen';renderListen();state.tab='playlists';renderLists();state.tab=tab;applyDisplay();philApplyTextSize();updatePlayerUI();embeddedHeight();
  embeddedPost({type:'public-memory-audio-response',action:m.action,requestId:m.requestId,ok:true,value:{applied:true}});
 }catch(error){embeddedPost({type:'public-memory-audio-response',action:m.action,requestId:m.requestId,ok:false,error:String(error?.message||'Audio backup could not be processed.').slice(0,300)});}
}
